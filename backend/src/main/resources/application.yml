server:
  port: 8080

spring:
  config:
    import: "optional:file:./.env.local[.properties]"
  application:
    name: viet-letters-backend
  servlet:
    multipart:
      max-file-size: 8MB
      max-request-size: 9MB
  datasource:
    url: jdbc:mysql://localhost:3306/viet_letters_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.MySQL8Dialect
    open-in-view: false
  flyway:
    enabled: true
    baseline-on-migrate: true
    baseline-version: 0
    locations: classpath:db/migration
    clean-disabled: true

# Custom App Config
app:
  ai:
    base-url: ${AI_BASE_URL:https://api.openai.com/v1}
    api-key: ${AI_API_KEY:}
    model: ${AI_MODEL:}
  media:
    directory: ${APP_MEDIA_DIRECTORY:./uploads}
  jwt:
    secret: ${APP_JWT_SECRET}
    expiration-ms: 86400000 # 1 day in milliseconds
  otp:
    expiry-minutes: 5
